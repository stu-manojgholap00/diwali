<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शुभ दीपावली</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#240046,#5a189a,#ff8500);
position:relative;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
}

.container{
position:relative;
z-index:5;
max-width:800px;
width:90%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:30px;
padding:50px;
text-align:center;
box-shadow:0 0 50px rgba(255,215,0,.5);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.diya{
font-size:90px;
animation:flicker 1.5s infinite;
}

@keyframes flicker{
0%,100%{
transform:scale(1);
filter:drop-shadow(0 0 10px gold);
}
50%{
transform:scale(1.1);
filter:drop-shadow(0 0 30px gold);
}
}

h1{
font-size:3.5rem;
color:#ffd700;
margin:15px 0;
text-shadow:0 0 20px gold;
}

h2{
color:white;
margin-bottom:15px;
font-size:1.8rem;
}

p{
color:white;
font-size:1.2rem;
line-height:1.8;
margin-top:20px;
}

button{
margin-top:30px;
padding:18px 35px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#ffd700,#ff8c00);
font-size:19px;
font-weight:bold;
cursor:pointer;
transition:.4s;
box-shadow:0 0 30px gold;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 50px gold;
}

.lamp{
position:absolute;
font-size:40px;
animation:updown 3s infinite ease-in-out;
}

.l1{left:5%;top:10%;}
.l2{right:5%;top:10%;}
.l3{left:8%;bottom:10%;}
.l4{right:8%;bottom:10%;}

@keyframes updown{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-15px);}
}

.sparkle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2;}
50%{opacity:1;}
}

@media(max-width:768px){

.container{
padding:25px;
}

h1{
font-size:2.2rem;
}

h2{
font-size:1.2rem;
}

p{
font-size:1rem;
}

.diya{
font-size:70px;
}
}
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="lamp l1">🪔</div>
<div class="lamp l2">🪔</div>
<div class="lamp l3">🪔</div>
<div class="lamp l4">🪔</div>

<div class="container">

<div class="diya">🪔</div>

<h1>✨ शुभ दीपावली ✨</h1>

<h2>आपणास व आपल्या परिवारास हार्दिक शुभेच्छा</h2>

<p>
प्रकाशाच्या या मंगलमय सणानिमित्त आपल्या जीवनात
सुख, समृद्धी, आरोग्य, यश आणि आनंदाचा प्रकाश सदैव
तेवत राहो. नवीन स्वप्नांना नवीन दिशा मिळो आणि
प्रत्येक दिवस उज्ज्वल होवो.
</p>

<button id="btn">
🎆 शुभेच्छांचा वर्षाव 🎆
</button>

</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles=[];

class Particle{
constructor(x,y,color){
this.x=x;
this.y=y;
this.color=color;
this.angle=Math.random()*Math.PI*2;
this.speed=Math.random()*8+2;
this.life=120;
}

update(){
this.x+=Math.cos(this.angle)*this.speed;
this.y+=Math.sin(this.angle)*this.speed;
this.speed*=0.97;
this.life--;
}

draw(){
ctx.beginPath();
ctx.arc(this.x,this.y,3,0,Math.PI*2);
ctx.fillStyle=this.color;
ctx.fill();
}
}

function boom(x,y){

let colors=[
"#ffd700",
"#ff4d00",
"#00ffff",
"#ff00ff",
"#00ff99",
"#ffffff"
];

for(let i=0;i<150;i++){
particles.push(
new Particle(
x,
y,
colors[Math.floor(Math.random()*colors.length)]
)
);
}
}

function animate(){

ctx.fillStyle="rgba(0,0,0,0.15)";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=particles.length-1;i>=0;i--){

particles[i].update();
particles[i].draw();

if(particles[i].life<=0){
particles.splice(i,1);
}
}

requestAnimationFrame(animate);
}

animate();

document.addEventListener("click",(e)=>{
boom(e.clientX,e.clientY);
});

document.addEventListener("touchstart",(e)=>{
boom(
e.touches[0].clientX,
e.touches[0].clientY
);
});

document.getElementById("btn").onclick=()=>{

for(let i=0;i<15;i++){

setTimeout(()=>{

boom(
Math.random()*window.innerWidth,
Math.random()*window.innerHeight/1.8
);

},i*250);

}
};

setInterval(()=>{

boom(
Math.random()*window.innerWidth,
Math.random()*window.innerHeight/2
);

},2000);

window.onresize=()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
};
</script>

</body>
</html>
